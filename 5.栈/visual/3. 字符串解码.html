<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3. 字符串解码 · 算法详解</title>
<style>
:root{--bg:#F3F3F5;--card:#fff;--text:#1F2937;--primary:#3B7DD8;--warm:#D4744C;--accent-green:#16A34A;--border:#E2E5E9;--code-bg:#111827;--code-text:#E5E7EB}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:linear-gradient(135deg,#3B7DD8 0%,#5B9CF5 40%,#D4744C 100%);color:#fff;padding:40px 24px;text-align:center}
main{max-width:1000px;margin:0 auto;padding:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 26px;margin:18px 0;box-shadow:0 8px 24px rgba(15,23,42,0.05)}
h2{margin:0 0 14px;font-size:22px;border-left:5px solid var(--primary);padding-left:12px}
pre{background:var(--code-bg);color:var(--code-text);padding:16px;border-radius:14px;overflow:auto;font-size:13px}
.stack{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.item{background:#F8FAFC;border:2px solid #CBD5E1;border-radius:8px;padding:6px 14px;font-family:Consolas,monospace;font-weight:700}
</style>
</head>
<body>
<header>
  <div style="background:rgba(255,255,255,0.2);display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;margin-bottom:10px">LeetCode 394 · 中等</div>
  <h1 style="margin:0;color:#fff">3. 字符串解码</h1>
</header>
<main>
<div class="card">
  <h2>1. 题目理解</h2>
  <p>解码 k[encoded_string] 形式的嵌套字符串。</p>
</div>

<div class="card">
  <h2>2. 核心思路</h2>
  <p>用栈存储 [当前数字, 当前字符串]，遇到 ] 时弹出解码并重新入栈。</p>
</div>

<div class="card">
  <h2>3. 伪代码</h2>
  <pre><code>stack = []
for c in s:
    if c != ']': stack.append(c)
    else:
        sub = pop until '['
        k = pop number
        stack.append( k * sub )</code></pre>
</div>

<div class="card">
  <h2>4. 可视化 (简化)</h2>
  <div class="stack" id="stack"></div>
  <button onclick="step()">下一步</button>
  <p id="log"></p>
</div>

<script>
let st = [];
let i = 0;
const s = "3[a2[c]]";
function render() {
  document.getElementById('stack').innerHTML = st.map(x => `<div class="item">${x}</div>`).join('');
}
function step() {
  if (i >= s.length) return;
  const c = s[i++];
  document.getElementById('log').innerText = `处理: ${c}`;
  if (c !== ']') {
    st.push(c);
  } else {
    let sub = '';
    while (st.length && st[st.length-1] !== '[') sub = st.pop() + sub;
    st.pop(); // [
    let k = '';
    while (st.length && !isNaN(st[st.length-1])) k = st.pop() + k;
    st.push( parseInt(k) * sub );
  }
  render();
}
render();
</script>
</main>
</body>
</html>
